name: Compilar Mando Caixun

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: mando-caixun
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp mando-caixun/app/build/outputs/apk/debug/app-debug.apk mando-caixun.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mando
          name: Mando Caixun
          files: mando-caixun.apk
