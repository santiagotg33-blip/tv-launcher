name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fuente chubby
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fL -o app/src/main/assets/fonts/chubby.ttf "https://github.com/google/fonts/raw/main/ofl/lilitaone/LilitaOne-Regular.ttf" || true
          [ -s app/src/main/assets/fonts/chubby.ttf ] || { rm -f app/src/main/assets/fonts/chubby.ttf; echo "Sin fuente: se usara Heavy"; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lanzador, Control TV y CTV (ultima compilacion)
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            remote/build/outputs/apk/debug/remote-debug.apk
            ctv/build/outputs/apk/debug/ctv-debug.apk
