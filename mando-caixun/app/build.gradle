plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.caixun.mando'
    compileSdk 34

    signingConfigs {
        fijo {
            storeFile file('mando.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'pkcs12'
        }
    }

    defaultConfig {
        applicationId 'com.caixun.mando'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fijo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                    'META-INF/INDEX.LIST', 'META-INF/AL2.0', 'META-INF/LGPL2.1',
                    'META-INF/versions/**']
        }
    }
}

dependencies {
    implementation('dev.mobile:dadb:1.2.7') {
        exclude group: 'org.junit.jupiter'
        exclude group: 'org.junit.platform'
        exclude group: 'org.junit'
    }
}
