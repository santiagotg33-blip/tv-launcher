plugins { id 'com.android.application' }
android {
    namespace 'com.tvlauncher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tvlauncher'
        minSdk 21
        targetSdk 25
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
